<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10131b">
<title>Nexorahub — Coming Soon</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem;color:#f5f7fb;background:radial-gradient(ellipse at 50% 0%,#253552 0,#141a27 42%,#0d1017 100%)}main{width:min(100%,720px);text-align:center;padding:clamp(2rem,7vw,5rem) 1rem}.mark{display:inline-grid;place-items:center;width:58px;height:58px;margin-bottom:2rem;border:1px solid #506a92;border-radius:18px;color:#a9cbff;font-size:1.7rem;font-weight:750;background:#1c2b41;box-shadow:0 0 48px #4673b533}h1{margin:0;font-size:clamp(2.8rem,9vw,5.5rem);letter-spacing:-.065em;line-height:1}p{margin:1.5rem auto 0;max-width:34rem;color:#b9c3d4;font-size:clamp(1rem,2.5vw,1.2rem);line-height:1.7}.status{display:inline-flex;align-items:center;gap:.55rem;margin-top:2rem;padding:.65rem .95rem;border:1px solid #35435a;border-radius:999px;color:#dce6f5;font-size:.9rem;background:#182131}.dot{width:8px;height:8px;border-radius:50%;background:#82d9b2;box-shadow:0 0 12px #82d9b288}footer{margin-top:5rem;color:#748096;font-size:.82rem}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true">N</div>
<h1>Nexorahub</h1>
<p>A new hub is taking shape. We’re getting things ready—please check back soon.</p>
<div class="status"><span class="dot" aria-hidden="true"></span>Coming soon</div>
<footer>© <span id="year"></span> Nexorahub</footer>
</main>
<script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>
